name: Build and Validate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout proposal repo
        uses: actions/checkout@v6

      - name: Check toolchain pin
        run: bash scripts/check-toolchain-pin.sh

      - name: Install bootstrap Go
        uses: actions/setup-go@v6
        with:
          # The fork tracks upstream master, whose minimum bootstrap is
          # go1.26 (the fork carries no VERSION file: it is a devel build).
          go-version: '1.26'
          cache: false

      - name: Vet and test this repo's Go
        # Runs on the bootstrap toolchain, before the decimal fork is
        # built: tools/buildsite is ordinary Go. Programs that need the
        # fork live in their own modules (tests/, playground/examples/).
        run: |
          go vet ./...
          go test ./... -count=1

      - name: Clone Go fork at the locked SHA
        run: |
          FORK_SHA="$(awk -F= '/^fork_sha=/{print $2}' toolchain.lock)"
          git clone --filter=blob:none https://github.com/marcelocantos/go.git /tmp/go-decimal
          git -C /tmp/go-decimal checkout --detach "$FORK_SHA"
          test "$(git -C /tmp/go-decimal rev-parse HEAD)" = "$FORK_SHA"

      - name: Build toolchain from source
        run: |
          cd /tmp/go-decimal/src
          GOROOT_BOOTSTRAP="$(go env GOROOT)" \
            CGO_ENABLED=0 GOTOOLCHAIN=local GOEXPERIMENT='' \
            ./make.bash
        env:
          GOROOT: /tmp/go-decimal

      - name: Verify composite decimal argument and return values
        working-directory: /tmp/go-decimal/src
        run: |
          set -o pipefail
          ../bin/go test -count=1 cmd/internal/testdir -run '^Test/decimal_abi.go$' -v | tee /tmp/decimal-abi.log
          grep -q -- '--- PASS: Test/decimal_abi.go' /tmp/decimal-abi.log
          ../bin/go test -count=1 cmd/internal/testdir -run '^Test/decimal_abi.go$' -target=linux/386 -v | tee /tmp/decimal-abi-386.log
          grep -q -- '--- PASS: Test/decimal_abi.go' /tmp/decimal-abi-386.log
        env:
          GOROOT: /tmp/go-decimal
          GOTOOLCHAIN: local
          GOEXPERIMENT: decimal
          CGO_ENABLED: '0'

      - name: Run quantum validation tests
        run: |
          /tmp/go-decimal/bin/go clean -cache
          /tmp/go-decimal/bin/go run $GITHUB_WORKSPACE/tests/quantum_validate.go
        env:
          GOROOT: /tmp/go-decimal
          GOTOOLCHAIN: local
          GOEXPERIMENT: decimal
          CGO_ENABLED: '0'

      - name: Run the decimal kernel's gates
        # internal/bid is the one arithmetic kernel behind the decimal
        # types. Its package test runs the differential oracle at 10^5
        # cases per operation and width, the in-tree conformance suite,
        # and the contract's worked examples. The long run below is the
        # oracle gate: 10^6 cases per operation, mismatch count locked at
        # zero. GOARCH=386 runs the same tests on a 32-bit target.
        working-directory: /tmp/go-decimal/src
        run: |
          ../bin/go test -count=1 ./internal/bid/
          ../bin/go test -count=1 ./internal/bid/ -run 'TestKernel' -args -bid.long
          GOARCH=386 ../bin/go test -count=1 ./internal/bid/
        env:
          GOROOT: /tmp/go-decimal
          GOTOOLCHAIN: local
          GOEXPERIMENT: decimal
          CGO_ENABLED: '0'

      - name: Run strconv decimal tests
        working-directory: /tmp/go-decimal/src
        run: ../bin/go test ./strconv/ -run Decimal -v -count=1
        env:
          GOROOT: /tmp/go-decimal
          GOTOOLCHAIN: local
          GOEXPERIMENT: decimal
          CGO_ENABLED: '0'

      - name: Run fmt tests
        # All of fmt, not -run Decimal: its decimal cases are rows in the
        # tables of TestSprintf and TestScan, so that filter matches nothing
        # and passes with "no tests to run".
        working-directory: /tmp/go-decimal/src
        run: ../bin/go test ./fmt/ -count=1
        env:
          GOROOT: /tmp/go-decimal
          GOTOOLCHAIN: local
          GOEXPERIMENT: decimal
          CGO_ENABLED: '0'

      - name: Run math decimal tests
        working-directory: /tmp/go-decimal/src
        run: ../bin/go test ./math/ -run Decimal -v -count=1
        env:
          GOROOT: /tmp/go-decimal
          GOTOOLCHAIN: local
          GOEXPERIMENT: decimal
          CGO_ENABLED: '0'

      - name: Run the standard library's tests with the experiment off
        # While GOEXPERIMENT=decimal is off no existing program may change.
        # Building every std test binary in this mode catches a decimal case
        # added to an external test package without a goexperiment.decimal
        # constraint (those packages are not compiled with -std). The testdir
        # run executes test/decimal_off.go, a program outside std that checks
        # it sees no new reflect kinds; reflect's TestDecimalKindNames checks
        # the same from inside std. cmd is left out: its tests compare the
        # tools' version strings. The decimal API gate is checked separately.
        working-directory: /tmp/go-decimal/src
        run: |
          set -o pipefail
          ../bin/go test -short -count=1 std
          ../bin/go test -count=1 -run 'TestDecimal.*Gate' cmd/compile/internal/test
          ../bin/go test -count=1 cmd/internal/testdir -run 'Test/decimal' -v | tee /tmp/nodecimal-testdir.log
          grep -q -- '--- PASS: Test/decimal_off.go' /tmp/nodecimal-testdir.log
        env:
          GOROOT: /tmp/go-decimal
          GOTOOLCHAIN: local
          GOEXPERIMENT: nodecimal
          CGO_ENABLED: '0'

      - name: Verify default-off and enabled API surfaces
        working-directory: /tmp/go-decimal/src
        run: |
          GOEXPERIMENT= ../bin/go test -count=1 cmd/api -run '^TestCheck$'
          GOEXPERIMENT=decimal ../bin/go test -count=1 cmd/api -run '^TestCheck$'
        env:
          GOROOT: /tmp/go-decimal
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'

      # Reruns every case of the reflection-library survey and fails if any
      # outcome differs from research/reflect-survey/results/results.tsv.
      # Many cases are expected to fail (that is what the survey measures);
      # this checks that the survey runs and that its table is current.
      - name: Check the reflection-library survey
        working-directory: research/reflect-survey
        run: /tmp/go-decimal/bin/go run ./cmd/survey -check
        env:
          GOROOT: /tmp/go-decimal
          GOTOOLCHAIN: local
          GOEXPERIMENT: decimal
          CGO_ENABLED: '0'

      - name: Create toolchain tarball
        run: |
          cd /tmp/go-decimal
          tar czf /tmp/go-decimal-linux-amd64.tar.gz \
            --exclude='.git' \
            bin/ src/ pkg/ lib/ misc/ api/ doc/ go.env \
            LICENSE PATENTS SECURITY.md

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: go-decimal-linux-amd64
          path: /tmp/go-decimal-linux-amd64.tar.gz
          retention-days: 7

  bigendian:
    # internal/bid makes no assumption about memory word order, and this is
    # what tests that: the kernel's test binary for a big-endian target, run
    # under qemu-user. It runs from the package directory for testdata.
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout proposal repo
        uses: actions/checkout@v6

      - name: Install bootstrap Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false

      - name: Clone Go fork at the locked SHA
        run: |
          FORK_SHA="$(awk -F= '/^fork_sha=/{print $2}' toolchain.lock)"
          git clone --filter=blob:none https://github.com/marcelocantos/go.git /tmp/go-decimal
          git -C /tmp/go-decimal checkout --detach "$FORK_SHA"
          test "$(git -C /tmp/go-decimal rev-parse HEAD)" = "$FORK_SHA"

      - name: Build toolchain from source
        run: |
          cd /tmp/go-decimal/src
          GOROOT_BOOTSTRAP="$(go env GOROOT)" \
            CGO_ENABLED=0 GOTOOLCHAIN=local GOEXPERIMENT='' \
            ./make.bash
        env:
          GOROOT: /tmp/go-decimal

      - name: Install qemu-user
        run: sudo apt-get update && sudo apt-get install -y qemu-user

      - name: Run the kernel's tests on s390x
        working-directory: /tmp/go-decimal/src/internal/bid
        run: |
          # TestGenerated runs the go command, which must be the fork's.
          export PATH=/tmp/go-decimal/bin:$PATH
          GOOS=linux GOARCH=s390x go test -c -o /tmp/bid.s390x internal/bid
          qemu-s390x /tmp/bid.s390x -test.short
        env:
          GOROOT: /tmp/go-decimal
          GOTOOLCHAIN: local
          GOEXPERIMENT: decimal
          CGO_ENABLED: '0'

  power-dfp:
    # On linux/ppc64le the fork lowers the decimal operators to POWER's
    # decimal floating-point instructions and keeps decimal values in
    # memory as DPD (proposal design decision 10). This runs the tests
    # that prove that path under qemu-user: internal/bid's differential test of every
    # operator against the kernel (TestOperators), the check that the
    # operators' machine code is the DFP instructions and calls nothing
    # (TestOperatorsUseHardware), the kernel's own tests, the libraries
    # whose decimal support crosses the memory form, and the language
    # tests under test/. QEMU implements DFP with decNumber, so this checks
    # the lowering and the encodings, not POWER silicon. The published
    # vector suites are not in this repository and do not run here. The
    # job runs at QEMU's default CPU, not its POWER8 model: the runtime's
    # asynchronous preemption saves vector registers with STXV, an ISA 3.0
    # instruction, which POWER8 lacks (upstream; not decimal code). Every
    # DFP instruction the lowering uses is ISA 2.06 or older.
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout proposal repo
        uses: actions/checkout@v6

      - name: Install bootstrap Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false

      - name: Clone Go fork at the locked SHA
        run: |
          FORK_SHA="$(awk -F= '/^fork_sha=/{print $2}' toolchain.lock)"
          git clone --filter=blob:none https://github.com/marcelocantos/go.git /tmp/go-decimal
          git -C /tmp/go-decimal checkout --detach "$FORK_SHA"
          test "$(git -C /tmp/go-decimal rev-parse HEAD)" = "$FORK_SHA"

      - name: Build toolchain from source
        run: |
          cd /tmp/go-decimal/src
          GOROOT_BOOTSTRAP="$(go env GOROOT)" \
            CGO_ENABLED=0 GOTOOLCHAIN=local GOEXPERIMENT='' \
            ./make.bash
        env:
          GOROOT: /tmp/go-decimal

      - name: Install qemu-user
        run: sudo apt-get update && sudo apt-get install -y qemu-user

      - name: Check the lowering in the compiler's output
        # codegen/decimal.go requires the DFP instructions at power8, power9
        # and power10, and no runtime call.
        working-directory: /tmp/go-decimal/src
        run: |
          # Fail rather than pass vacuously on a fork without the lowering.
          test -f ../test/codegen/decimal.go
          test -f internal/bid/operators_ppc64le_test.go
          ../bin/go test -count=1 cmd/internal/testdir -run 'Test/codegen/decimal.go' -all_codegen -v | tee /tmp/codegen.log
          grep -q -- '--- PASS: Test/codegen/decimal.go' /tmp/codegen.log
        env:
          GOROOT: /tmp/go-decimal
          GOTOOLCHAIN: local
          GOEXPERIMENT: decimal
          CGO_ENABLED: '0'

      - name: Run the decimal tests on ppc64le
        working-directory: /tmp/go-decimal/src
        run: |
          set -o pipefail
          export PATH=/tmp/go-decimal/bin:$PATH
          mkdir -p /tmp/ppc
          pkgs="internal/bid math math/decimal strconv fmt reflect testing/quick encoding/binary encoding/gob encoding/json encoding/json/v2 encoding/xml database/sql internal/fmtsort"
          for p in $pkgs; do
            GOOS=linux GOARCH=ppc64le go test -c -o /tmp/ppc/$(echo $p | tr / _).test ./$p
          done
          GOOS=linux GOARCH=ppc64le go test -c -o /tmp/ppc/runtime.test ./runtime
          status=0
          for p in $pkgs; do
            echo "== $p"
            (cd $p && qemu-ppc64le /tmp/ppc/$(echo $p | tr / _).test -test.short) || status=1
          done
          (cd internal/bid && qemu-ppc64le /tmp/ppc/internal_bid.test \
            -test.run 'TestOperators|TestDecimalRoundingMode|TestDPD' -test.v) > /tmp/operators.log || status=1
          grep -E '^(--- |ok|PASS|FAIL)' /tmp/operators.log
          for t in TestOperatorsUseHardware TestOperators TestDecimalRoundingMode; do
            grep -q -- "^--- PASS: $t " /tmp/operators.log || { echo "$t did not pass"; status=1; }
          done
          echo "== runtime -run Decimal"
          (cd runtime && qemu-ppc64le /tmp/ppc/runtime.test -test.short -test.run 'Decimal') || status=1
          exit $status
        env:
          GOROOT: /tmp/go-decimal
          GOTOOLCHAIN: local
          GOEXPERIMENT: decimal
          CGO_ENABLED: '0'

      - name: Run the decimal language tests on ppc64le
        # cmd/internal/testdir runs a cross-compiled test through
        # go_linux_ppc64le_exec when it is on PATH.
        working-directory: /tmp/go-decimal/src
        run: |
          mkdir -p /tmp/execbin
          printf '#!/bin/sh\nexec qemu-ppc64le "$@"\n' > /tmp/execbin/go_linux_ppc64le_exec
          chmod +x /tmp/execbin/go_linux_ppc64le_exec
          export PATH=/tmp/execbin:/tmp/go-decimal/bin:$PATH
          go test -count=1 cmd/internal/testdir -run 'Test/decimal' -target=linux/ppc64le -v
        env:
          GOROOT: /tmp/go-decimal
          GOTOOLCHAIN: local
          GOEXPERIMENT: decimal
          CGO_ENABLED: '0'

  bench:
    # The linux/amd64 column of the kernel's benchmark baseline. Dispatched by
    # hand and on master; the result is an artifact, and committing it as
    # testdata/bench_baseline_linux_amd64.txt in the fork is deliberate.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout proposal repo
        uses: actions/checkout@v6

      - name: Install bootstrap Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false

      - name: Clone Go fork at the locked SHA
        run: |
          FORK_SHA="$(awk -F= '/^fork_sha=/{print $2}' toolchain.lock)"
          git clone --filter=blob:none https://github.com/marcelocantos/go.git /tmp/go-decimal
          git -C /tmp/go-decimal checkout --detach "$FORK_SHA"
          test "$(git -C /tmp/go-decimal rev-parse HEAD)" = "$FORK_SHA"

      - name: Build toolchain from source
        run: |
          cd /tmp/go-decimal/src
          GOROOT_BOOTSTRAP="$(go env GOROOT)" \
            CGO_ENABLED=0 GOTOOLCHAIN=local GOEXPERIMENT='' \
            ./make.bash
        env:
          GOROOT: /tmp/go-decimal

      - name: Run the kernel's benchmarks
        working-directory: /tmp/go-decimal/src/internal/bid
        run: |
          ../../../bin/go test -c -o /tmp/bid.test internal/bid
          grep -m1 'model name' /proc/cpuinfo | tee /tmp/bench_baseline_linux_amd64.txt
          /tmp/bid.test -test.run XXX -test.bench BenchmarkKernel -test.benchmem \
            -test.count 8 -test.benchtime 100ms | tee -a /tmp/bench_baseline_linux_amd64.txt
        env:
          GOROOT: /tmp/go-decimal
          GOTOOLCHAIN: local
          GOEXPERIMENT: decimal
          CGO_ENABLED: '0'

      - name: Upload the benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: bench-linux-amd64
          path: /tmp/bench_baseline_linux_amd64.txt

  bench-ab:
    # Times the kernel's benchmarks of two fork commits on one runner, in
    # interleaved rounds, so that runner-to-runner variance does not enter
    # the comparison. Runs only when dispatched on a branch other than
    # master; bench-ab.lock names the two commits.
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout proposal repo
        uses: actions/checkout@v6

      - name: Install bootstrap Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false

      - name: Clone the fork at both commits
        run: |
          for t in base head; do
            sha="$(awk -F= "/^${t}=/{print \$2}" bench-ab.lock)"
            git clone --filter=blob:none https://github.com/marcelocantos/go.git /tmp/$t
            git -C /tmp/$t checkout --detach "$sha"
            test "$(git -C /tmp/$t rev-parse HEAD)" = "$sha"
          done

      - name: Build both toolchains and test binaries
        run: |
          boot="$(go env GOROOT)"
          for t in base head; do
            (cd /tmp/$t/src && GOROOT=/tmp/$t GOROOT_BOOTSTRAP="$boot" CGO_ENABLED=0 GOTOOLCHAIN=local GOEXPERIMENT='' ./make.bash)
            (cd /tmp/$t/src/internal/bid && GOROOT=/tmp/$t GOTOOLCHAIN=local GOEXPERIMENT=decimal CGO_ENABLED=0 \
              /tmp/$t/bin/go test -c -o /tmp/$t.test internal/bid)
          done

      - name: Run interleaved rounds
        run: |
          rounds="$(awk -F= '/^rounds=/{print $2}' bench-ab.lock)"
          bench="$(sed -n 's/^bench=//p' bench-ab.lock)"
          mkdir -p /tmp/out
          grep -m1 'model name' /proc/cpuinfo | tee /tmp/out/cpu.txt
          for r in $(seq 1 "${rounds:-8}"); do
            for t in base head; do
              (cd /tmp/$t/src/internal/bid && /tmp/$t.test -test.run XXX -test.bench "${bench:-BenchmarkKernel}" \
                -test.benchmem -test.count 1 -test.benchtime 100ms) >> /tmp/out/$t.txt
            done
            echo "round $r done: $(uptime)"
          done

      - name: Upload the results
        uses: actions/upload-artifact@v7
        with:
          name: bench-ab-linux-amd64
          path: /tmp/out/

  playground:
    # Builds the static in-browser playground from the pinned fork, checks
    # that the bundle is reproducible, runs the browser journey against it,
    # runs the fork's decimal tests on js/wasm (the backend the browser
    # runs), and on master hands the bundle to the Pages deployment below.
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout proposal repo
        uses: actions/checkout@v6

      - name: Install bootstrap Go
        uses: actions/setup-go@v6
        with:
          # Same as the build job: the fork needs go1.26 to bootstrap.
          go-version: '1.26'
          cache: false

      - name: Clone Go fork at the locked SHA
        run: |
          FORK_SHA="$(awk -F= '/^fork_sha=/{print $2}' toolchain.lock)"
          git clone --filter=blob:none https://github.com/marcelocantos/go.git /tmp/go-decimal
          git -C /tmp/go-decimal checkout --detach "$FORK_SHA"
          test "$(git -C /tmp/go-decimal rev-parse HEAD)" = "$FORK_SHA"

      - name: Build toolchain from source
        run: |
          cd /tmp/go-decimal/src
          GOROOT_BOOTSTRAP="$(go env GOROOT)" \
            CGO_ENABLED=0 GOTOOLCHAIN=local GOEXPERIMENT='' \
            ./make.bash
        env:
          GOROOT: /tmp/go-decimal

      - name: Build the playground bundle twice and compare digests
        # The second build starts from an empty build cache, so every
        # archive and both tools are compiled again. Both must match the
        # digests committed in playground/digests.txt, which move only by
        # deliberate commit (see tools/buildsite). buildsite also fails if
        # an example's native go run output has drifted from the expected
        # output committed beside it.
        run: |
          /tmp/go-decimal/bin/go run ./tools/buildsite -goroot /tmp/go-decimal -out site
          GOCACHE="$RUNNER_TEMP/gocache-rebuild" \
            /tmp/go-decimal/bin/go run ./tools/buildsite -goroot /tmp/go-decimal -out "$RUNNER_TEMP/site-rebuild"
          diff playground/digests.txt site/digests.txt
          diff playground/digests.txt "$RUNNER_TEMP/site-rebuild/digests.txt"
        env:
          GOROOT: /tmp/go-decimal
          GOTOOLCHAIN: local
          GOEXPERIMENT: decimal
          CGO_ENABLED: '0'

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run the decimal tests under js/wasm
        # internal/bid is the arithmetic kernel. fmt's decimal cases are
        # rows in its TestSprintf and TestScan tables, and -run Decimal
        # matches none of its tests, so the whole package runs.
        working-directory: /tmp/go-decimal/src
        run: |
          export PATH="/tmp/go-decimal/lib/wasm:$PATH"
          GOOS=js GOARCH=wasm ../bin/go test -count=1 ./internal/bid/
          GOOS=js GOARCH=wasm ../bin/go test -count=1 -run Decimal -v ./strconv/ ./math/
          GOOS=js GOARCH=wasm ../bin/go test -count=1 ./fmt/
        env:
          GOROOT: /tmp/go-decimal
          GOTOOLCHAIN: local
          GOEXPERIMENT: decimal
          CGO_ENABLED: '0'

      - name: Install the journey's browser
        working-directory: playground/journey
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run the browser journey
        working-directory: playground/journey
        run: node journey.mjs --site ../../site --metrics "$RUNNER_TEMP/journey/metrics.json" --shots "$RUNNER_TEMP/journey"

      - name: Upload journey results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playground-journey
          path: ${{ runner.temp }}/journey
          retention-days: 7

      - name: Upload the bundle for Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy-pages:
    # Serves the bundle at https://marcelocantos.github.io/go-decimal-proposal/.
    # Needs Settings > Pages > Source set to GitHub Actions.
    needs: playground
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download tarball artifact
        uses: actions/download-artifact@v8
        with:
          name: go-decimal-linux-amd64

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Go toolchain with decimal64/decimal128 (latest)
          body: |
            Auto-built Go toolchain with decimal64/decimal128 support for linux/amd64.
            Built from source at https://github.com/marcelocantos/go/tree/decimal.
          files: go-decimal-linux-amd64.tar.gz
          prerelease: true
          make_latest: false
